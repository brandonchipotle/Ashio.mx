<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashio</title>
<meta name="description" content="Socios expertos en marcas. Monterrey, México. Sitio próximamente.">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Ashio">
<meta property="og:description" content="Socios expertos en marcas. Próximamente.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_MX">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121211;
    --ink:#F2EFE9;
    --muted:#8C8880;
    --rule:rgba(242,239,233,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem;
  }
  .wrap{width:100%;max-width:30rem;text-align:center}
  .mark{
    font-size:clamp(1.75rem,7vw,2.5rem);
    font-weight:500;
    letter-spacing:.42em;
    text-indent:.42em;
    line-height:1;
  }
  .claim{
    margin-top:1.75rem;
    font-size:clamp(1rem,3.6vw,1.1rem);
    line-height:1.5;
    color:var(--ink);
  }
  .status{
    margin-top:.75rem;
    font-size:.8125rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .rule{height:1px;background:var(--rule);margin:2.5rem 0}
  nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.5rem 1.75rem;
  }
  nav a{
    color:var(--ink);
    text-decoration:none;
    font-size:.9375rem;
    padding:.25rem 0;
    border-bottom:1px solid transparent;
    transition:border-color .18s ease,color .18s ease;
  }
  nav a:hover,nav a:focus-visible{border-bottom-color:var(--ink)}
  nav a:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-bottom-color:transparent}
  footer{
    margin-top:2.5rem;
    font-size:.75rem;
    letter-spacing:.08em;
    color:var(--muted);
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="wrap">
    <h1 class="mark">ASHIO</h1>
    <p class="claim">Socios expertos en marcas para dueños de negocio.</p>
    <p class="status">Sitio próximamente</p>

    <div class="rule" role="presentation"></div>

    <!-- ===== Redes. Para agregar otra, copiar una línea <a> y pegar su URL. ===== -->
    <nav aria-label="Redes sociales de Ashio">
      <a href="https://www.instagram.com/ashio.mx/" rel="me noopener" target="_blank">Instagram</a>
    </nav>

    <footer>Monterrey, México</footer>
  </main>
</body>
</html>

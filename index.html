<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashiō</title>
<meta name="description" content="Expertos en estrategia de marca para dueños de negocio. Monterrey, México.">
<meta name="theme-color" content="#0d0d0d">
<meta property="og:title" content="Ashiō">
<meta property="og:description" content="Expertos en estrategia de marca para dueños de negocio.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ashio.mx/">
<meta property="og:locale" content="es_MX">
<link rel="canonical" href="https://ashio.mx/">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-black:#0d0d0d;
    --brand-bone:#f3efee;
    --accent:#cf7457;
    --accent-deep:#a35139;
    --muted:#aaaaaa;
    --font-title:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
    --radius:0;              /* la hoja de estilo fija radio 0 */
    --glass-tint:rgba(243,239,238,.055);
    --glass-line:rgba(243,239,238,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}
  body{
    min-height:100%;
    background:var(--brand-black);
    color:var(--brand-bone);
    font-family:var(--font-title);
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(1.25rem,5vw,4rem);
    position:relative;
    overflow:hidden;
  }

  /* Luz detrás del panel. Sin esto el frosted no tiene nada que difuminar.
     Acento óxido a opacidad baja, no como color de fondo. */
  body::before,
  body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
  }
  body::before{
    width:min(70vw,620px);
    aspect-ratio:1;
    top:-18vh;
    left:-12vw;
    background:radial-gradient(circle,rgba(207,116,87,.30),rgba(207,116,87,0) 68%);
  }
  body::after{
    width:min(62vw,540px);
    aspect-ratio:1;
    bottom:-20vh;
    right:-14vw;
    background:radial-gradient(circle,rgba(163,81,57,.26),rgba(163,81,57,0) 70%);
  }

  .panel{
    position:relative;
    z-index:1;
    width:100%;
    max-width:27rem;
    text-align:center;
    padding:clamp(2.25rem,8vw,3.5rem) clamp(1.5rem,6vw,3rem);
    border-radius:var(--radius);
    background:var(--glass-tint);
    border:1px solid var(--glass-line);
    box-shadow:
      inset 0 1px 0 rgba(243,239,238,.10),
      0 24px 60px -24px rgba(0,0,0,.75);
  }
  @supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){
    .panel{
      -webkit-backdrop-filter:blur(26px) saturate(135%);
      backdrop-filter:blur(26px) saturate(135%);
    }
  }
  /* Si el navegador no soporta frosted, panel sólido legible. */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .panel{background:rgba(22,22,22,.92)}
  }

  /* Logotipo oficial vertical. Monocromo hueso, sin acento, macrón del mismo
     color, ancho mínimo por encima de los 100 px que marca la hoja. */
  .logo{
    display:block;
    width:clamp(132px,34vw,176px);
    height:auto;
    margin:0 auto;
    color:var(--brand-bone);
  }

  .claim{
    margin-top:clamp(1.75rem,6vw,2.25rem);
    font-size:clamp(1rem,3.4vw,1.125rem);
    font-weight:300;
    line-height:1.5;
    text-wrap:balance;
  }
  .status{
    margin-top:.875rem;
    font-size:.75rem;
    font-weight:500;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .rule{
    height:1px;
    background:var(--glass-line);
    margin:clamp(1.75rem,6vw,2.25rem) 0;
  }
  nav a{
    display:inline-block;
    color:var(--brand-bone);
    text-decoration:none;
    font-size:.9375rem;
    font-weight:400;
    padding:.25rem 0;
    border-bottom:1px solid var(--glass-line);
    transition:color .18s ease,border-color .18s ease;
  }
  nav a:hover,nav a:focus-visible{color:var(--accent);border-bottom-color:var(--accent)}
  nav a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
  footer{
    margin-top:clamp(1.75rem,6vw,2.25rem);
    font-size:.75rem;
    letter-spacing:.08em;
    color:var(--muted);
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (prefers-contrast:more){
    .panel{background:rgba(13,13,13,.96);border-color:var(--brand-bone)}
    body::before,body::after{display:none}
  }
</style>
</head>
